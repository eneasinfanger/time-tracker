<div class="container mx-auto px-4 py-8 max-w-6xl">
  <!-- Header -->
  <div class="bg-white dark:bg-slate-900 rounded-lg shadow-sm border dark:border-gray-800 p-6 mb-6">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-4">Time Tracker</h1>

    <!-- Day Navigation -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <button (click)="navigateDay(-1)"
                class="flex items-center px-4 py-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
          Previous Day
        </button>

        <div class="text-xl font-semibold text-gray-900 dark:text-gray-100">{{ formatDateToDisplay(currentDate()) }}
        </div>

        <button (click)="navigateDay(1)"
                class="flex items-center px-4 py-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-white/5 rounded-lg transition-colors">
          Next Day
          <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>

        <!-- Date picker -->
        <input type="date" class="ml-4 p-2 border rounded dark:bg-transparent dark:border-gray-700 dark:text-gray-100"
               [value]="currentDateISO()" (change)="navigateToInput($any($event.target).value)"/>
      </div>

      <div class="relative flex items-center space-x-3">
        <button (click)="logout()"
                class="px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
          Sign out
        </button>
        <settings-button (clicked)="settingsOpen.set(!settingsOpen())"/>
        @if (settingsOpen()) {
          <settings-menu (closed)="settingsOpen.set(false)" title="Edit settings"/>
        }
      </div>
    </div>
  </div>

  <!-- Activities Table -->
  <div class="bg-white dark:bg-slate-900 rounded-lg shadow-sm border dark:border-gray-800">
    <div class="p-6">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-4">Activities</h2>

      <div>
        <table class="w-full">
          <thead>
            <tr class="border-b border-gray-200 dark:border-gray-700">
              <th class="text-left py-3 px-4 font-medium text-gray-700 dark:text-gray-300">Start Time</th>
              <th class="text-left py-3 px-4 font-medium text-gray-700 dark:text-gray-300">End Time</th>
              <th class="text-left py-3 px-4 font-medium text-gray-700 dark:text-gray-300">Activity / Description</th>
              <th class="text-left py-3 px-4 font-medium text-gray-700 dark:text-gray-300 w-36">Task</th>
              <th class="text-left py-3 px-4 font-medium text-gray-700 dark:text-gray-300">Type</th>
              <th class="text-left py-3 px-4 font-medium text-gray-700 dark:text-gray-300 w-32">Actions</th>
            </tr>
          </thead>
          <tbody id="activitiesTable">
            @for (activity of activities(); track activity().id) {
              <tr activity-row
                  class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-white/5"
                  [activity]="activity"
                  [currentDate]="currentDateISO()" (addRow)="addNewActivity(activity().id)"
                  (removeRow)="removeActivity(activity().id)"></tr>
            }
          </tbody>
        </table>
      </div>

      <button (click)="addNewActivity()"
              class="mt-4 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium">
        + Add Activity
      </button>
    </div>
  </div>

  <time-summary [summary]="summary()" [dateDisplay]="formatDateToDisplay(currentDate())"/>
</div>
