<td class="py-3 px-4">
  <input suggestable type="time" [disabled]="isText()" class="w-full p-2 border border-gray-300 rounded-lg"
    [ngClass]="{'bg-gray-100': isText()}" [(ngModel)]="startTime" [suggestionProvider]="getStartSuggestions">
</td>
<td class="py-3 px-4">
  <input suggestable type="time" [disabled]="isText()" class="w-full p-2 border border-gray-300 rounded-lg"
    [ngClass]="{'bg-gray-100': isText()}" [(ngModel)]="endTime" [suggestionProvider]="getEndSuggestions">
</td>
<td class="py-3 px-4 relative">
  <input suggestable type="text" class="w-full p-2 border border-gray-300 rounded-lg"
    [(ngModel)]="description" [suggestionProvider]="getActivitySuggestions"
    (itemSelected)="setTaskFromDescription($event)" placeholder="Enter activity or description...">
</td>
<td class="py-3 px-4 relative">
  <input suggestable type="text" class="w-full p-2 border border-gray-300 rounded-lg"
    [(ngModel)]="task" [suggestionProvider]="getTaskSuggestions" (itemSelected)="setDescriptionFromTask($event)"
    placeholder="Enter task-number..">
</td>
<td class="py-3 px-4">
  <select class="w-full p-2 border border-gray-300 rounded-lg" [(ngModel)]="type">
    <option value="activity">Timed Activity</option>
    <option value="text">Text Only</option>
  </select>
</td>
<td class="py-3 px-4">
  <div class="flex space-x-2">
    <button type="button" class="table-action-button text-green-600" (click)="addRow.emit()">＋</button>
    <button type="button" class="table-action-button text-red-600" (click)="removeRow.emit()">✕</button>
  </div>
</td>
